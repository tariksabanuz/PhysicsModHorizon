[mod]
id = "horizon_physics"
version = "0.20.6"
priority = 100

[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# The solver, the pieces and the settings. In the client library, so the mob hooks there and the
# game's hooks can both reach it.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/client_lib.rs"
name = "native_horizon_physics"
source = "runtime.rs"
visibility = "pub"

# The quick setup on the title screen: drawing it (the previews and the HUD).
[[module]]
id = "setup"
file = "crates/horizon-client/src/client_lib.rs"
name = "native_horizon_physics_setup"
source = "setup.rs"
visibility = "pub"

# Options > Mods: the row and its settings page.
[[injection]]
id = "listed"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "listed.rs"
bindings = [{ name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" }]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "settings_click.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# Player.attack: a ragdoll or piece in front of the player is knocked away by the hit.
[[injection]]
id = "attack"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::attack"
helper = "attack.rs"
bindings = [{ name = "game", ty = "&crate::game::Game<'_>", value = "&*self" }]

# BannerRenderer as cloth: the flag bends in the wind (re-entrant: the hook draws the banner itself).
[[injection]]
id = "banner"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::block_entity_render::BlockEntityRenderer::render_one"
helper = "banner.rs"
bindings = [
  { name = "this", ty = "&BlockEntityRenderer", value = "self" },
  { name = "scene", ty = "&Scene<'_>", value = "scene" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "kind", ty = "&Kind", value = "kind" },
  { name = "base", ty = "Mat4", value = "base" },
  { name = "packed", ty = "u8", value = "packed" },
  { name = "lights", ty = "(Vec3, Vec3)", value = "lights" },
  { name = "crumbling", ty = "bool", value = "crumbling" },
  { name = "world_chests", ty = "bool", value = "world_chests" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# Camera.setup on the waves: in a boat or swimming at the surface, the eye rides the swell.
[[injection]]
id = "camera"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::camera_view"
helper = "camera.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "partial", ty = "f32", value = "partial" },
]

# The player's own model in a boat on the waves: moved with the boat and the camera.
[[injection]]
id = "player-model"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::player_model_geometry"
helper = "player_model.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

# ServerPlayerGameMode.destroyBlock, then what the broken block held up falls (trees, bridges).
[[injection]]
id = "collapse"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::break_block"
helper = "collapse.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

# ClientLevel.addDestroyBlockEffect: the block crumbles into pieces instead of particles.
[[injection]]
