  { name = "state", ty = "BlockStateId", value = "state" },
]

# A dying mob is drawn once more into the buffer, its parts are cut out and turned into a ragdoll;
# the mob itself is not drawn any more.
[[injection]]
id = "mob"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::mobs::render::render_with"
helper = "mob.rs"
bindings = [
  { name = "m", ty = "&Mob", value = "m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "atlas", ty = "Atlas", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&MobData", value = "data" },
  { name = "extra", ty = "&[(&Part, [f32; 4], u32, u32, bool)]", value = "extra" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# Where each model part starts, while a dying mob is captured.
[[injection]]
id = "part"
kind = "HEAD"
target = "horizon_client_lib::mobs::render::draw_normals"
helper = "part.rs"
bindings = [{ name = "out", ty = "&Vec<Vertex>", value = "&*out" }]

