[mod]
id = "horizon_physics"
version = "0.6.3"
priority = 100

[compatibility]
horizon_revision = "9d979caa48a3bb58203319b9ea044db58c38e0d8"

# The solver, the pieces and the settings. In the client library, so the mob hooks there and the
# game's hooks can both reach it.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/lib.rs"
name = "native_horizon_physics"
source = "runtime.rs"
visibility = "pub"

# Options > Mods: the row and its settings page.
[[injection]]
id = "listed"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "listed.rs"
bindings = [{ name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" }]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "settings_click.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# ClientLevel.addDestroyBlockEffect: the block crumbles into pieces instead of particles.
[[injection]]
id = "destroy"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::destroy_particles"
helper = "destroy.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
]

# A dying mob is drawn once more into the buffer, its parts are cut out and turned into a ragdoll;
# the mob itself is not drawn any more.
[[injection]]
id = "mob"
kind = "HEAD"
cancellable = true
target = "horizon_client::mobs::render::render_with"
helper = "mob.rs"
bindings = [
  { name = "m", ty = "&Mob", value = "m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "atlas", ty = "Atlas", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&MobData", value = "data" },
  { name = "extra", ty = "&[(&Part, [f32; 4], u32, u32)]", value = "extra" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# Where each model part starts, while a dying mob is captured.
[[injection]]
id = "part"
kind = "HEAD"
target = "horizon_client::mobs::render::draw_normals"
helper = "part.rs"
bindings = [{ name = "out", ty = "&Vec<Vertex>", value = "&*out" }]

# Once a frame, beside the other camera-relative entity geometry: step and draw the pieces.
[[injection]]
id = "world"
kind = "HEAD"
target = "horizon_client::game::end::Game<'_>::end_geometry"
helper = "world.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# ItemEntityRenderer: dropped items tumble and lie flat instead of bobbing and spinning.
[[injection]]
id = "items"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::item_draw::Game<'_>::dropped_item_geometry"
helper = "items.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# ClientPacketListener.handleExplosion: a fireball, sparks and smoke; the blast throws its blocks.
[[injection]]
id = "explode"
kind = "HEAD"
target = "horizon_client::game::lan_particles::Game<'_>::remote_explode"
helper = "explode.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "p", ty = "&play::Explode", value = "p" },
]

# A block the server turns to air, read while it is still there (an explosion's blocks).
[[injection]]
id = "aired"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::server_block"
helper = "aired.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "i32", value = "state" },
]

# LeashFeatureRenderer: leads as ropes (the knots are kept).
[[injection]]
id = "leads"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::leads::Game<'_>::leash_geometry"
helper = "leads.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# Boats ride the waves.
[[injection]]
id = "boats"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::boats::Game<'_>::boat_geometry"
helper = "boats.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# FishingHookRenderer's line as a rope.
[[injection]]
id = "fishing"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::fishing::Game<'_>::fishing_line"
helper = "fishing.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "size", ty = "[u32; 2]", value = "size" },
]

# CapeLayer: the cape as cloth.
[[injection]]
id = "cape"
kind = "HEAD"
cancellable = true
target = "horizon_client::mobs::render::cape"
helper = "cape.rs"
bindings = [
  { name = "m", ty = "&Mob", value = "m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "base", ty = "glam::Mat4", value = "base" },
  { name = "uv", ty = "[f32; 4]", value = "uv" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&MobData", value = "data" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# Vanilla's campfire smoke and fire's large smoke give way to the mod's.
[[injection]]
id = "campfire-smoke"
kind = "HEAD"
cancellable = true
target = "horizon_client::animate_tick::make_campfire_smoke"
helper = "campfire_smoke.rs"
bindings = [{ name = "pos", ty = "[i32; 3]", value = "pos" }]

[[injection]]
id = "fire-smoke"
kind = "HEAD"
cancellable = true
target = "horizon_client::animate_tick::add"
helper = "fire_smoke.rs"
bindings = [{ name = "ty", ty = "T", value = "ty" }]

# In the renderer: the waves and sway, beside the renderer's own code.
[[module]]
id = "sway"
file = "crates/horizon-client-render/src/lib.rs"
name = "native_horizon_physics_sway"
source = "sway.rs"
visibility = "pub"

# The water's surface corners get a mark of how open the water is there, for the waves.
[[injection]]
id = "fluid"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::mesher::Mesher<'_>::mesh_reusing"
helper = "fluid.rs"
bindings = [
  { name = "mesher", ty = "&mut Mesher<'_>", value = "&mut *self" },
  { name = "region", ty = "&[[Option<&Chunk>; 3]; 3]", value = "region" },
  { name = "sy", ty = "i32", value = "sy" },
  { name = "out", ty = "&mut SectionMesh", value = "&mut out" },
  { name = "scratch", ty = "&mut MeshScratch", value = "&mut *scratch" },
]

# A Horizon shader pack's terrain shader, with the waves and sway.
[[injection]]
id = "shader"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::gfx::native_material::shader_source"
helper = "shader.rs"
bindings = [{ name = "source", ty = "&str", value = "source" }]

# No shader pack picked: the mod's own vanilla-look pack runs, so the waves and sway can.
[[injection]]
id = "builtin"
kind = "HEAD"
target = "horizon_client::game::shader_packs::Game<'_>::shader_pack_inputs"
helper = "builtin.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# Before the game checks its Horizon shader pack: hand the renderer the sprite layers and settings,
# and build the pack again when they changed.
[[injection]]
id = "shader-pack"
kind = "HEAD"
target = "horizon_client::game::native_shaders::Game<'_>::tick_native_shader_pack"
helper = "shader_pack.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]
