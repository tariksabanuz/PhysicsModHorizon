[[injection]]
id = "fire-smoke"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::animate_tick::add"
helper = "fire_smoke.rs"
bindings = [{ name = "ty", ty = "T", value = "ty" }]

# In the renderer: the waves and sway, beside the renderer's own code.
[[module]]
id = "sway"
file = "crates/horizon-client-render/src/lib.rs"
name = "native_horizon_physics_sway"
source = "sway.rs"
visibility = "pub"

# The water's surface corners get a mark of how open the water is there, for the waves, and
# snow someone walked through gets its pressed top.
[[injection]]
id = "fluid"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::mesher::Mesher<'_>::mesh_reusing"
helper = "fluid.rs"
bindings = [
  { name = "mesher", ty = "&mut Mesher<'_>", value = "&mut *self" },
  { name = "region", ty = "&[[Option<&Chunk>; 3]; 3]", value = "region" },
  { name = "sy", ty = "i32", value = "sy" },
  { name = "out", ty = "&mut SectionMesh", value = "&mut out" },
  { name = "scratch", ty = "&mut MeshScratch", value = "&mut *scratch" },
]

# A Horizon shader pack's terrain shader, with the waves and sway. Hooked on `module`, which builds
# the pack's material module: `shader_source` takes its stage flags as a destructured tuple now,
# and a binding cannot name those.
[[injection]]
id = "shader"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::gfx::native_material::module"
helper = "shader.rs"
bindings = [
  { name = "stage", ty = "&horizon_shader_api::check::CheckedStage", value = "stage" },
  { name = "tags", ty = "&[(u32, u32)]", value = "tags" },
  { name = "materials", ty = "&[(u32, u32)]", value = "materials" },
  { name = "vertex", ty = "bool", value = "vertex" },
  { name = "displaced", ty = "bool", value = "displaced" },
  { name = "api", ty = "horizon_shader_api::Api", value = "api" },
]

# DirectX 12 (FXC): Horizon's own terrain shader made ready for FXC before the renderer builds
# it; the game crashed at its start there.
[[injection]]
id = "fxc"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::gfx::reuse::On<'_>::create_shader_module"
helper = "fxc.rs"
bindings = [
  { name = "this", ty = "&On<'_>", value = "self" },
  { name = "descriptor", ty = "&wgpu::ShaderModuleDescriptor<'_>", value = "&descriptor" },
]

# No shader pack picked: the mod's own vanilla-look pack runs, so the waves and sway can.
[[injection]]
id = "builtin"
kind = "HEAD"
target = "horizon_client::game::shader_packs::Game<'_>::shader_pack_inputs"
helper = "builtin.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# Before the game checks its Horizon shader pack: hand the renderer the sprite layers and settings,
# and build the pack again when they changed.
[[injection]]
id = "shader-pack"
kind = "HEAD"
target = "horizon_client::game::native_shaders::Game<'_>::tick_native_shader_pack"
helper = "shader_pack.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# The quick setup: the settings read as the game starts, then the title screen's place and its
# presses while it has not been done. Before other mods' title hooks (higher priority runs first),
# so nothing is drawn over it.
[[injection]]
id = "setup-load"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "setup_load.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "setup-draw"
kind = "HEAD"
cancellable = true
priority = 200
target = "horizon_client_lib::title::Title::draw"
helper = "setup_draw.rs"
bindings = [
  { name = "_title", ty = "&Title", value = "self" },
  { name = "atlas", ty = "&HudAtlas", value = "atlas" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "cursor", ty = "(f32, f32)", value = "cursor" },
  { name = "_hide_splash", ty = "bool", value = "hide_splash" },
]

[[injection]]
id = "setup-click"
kind = "HEAD"
cancellable = true
priority = 200
target = "horizon_client_lib::title::Title::click"
helper = "setup_click.rs"
bindings = [
  { name = "_title", ty = "&mut Title", value = "&mut *self" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
  { name = "size", ty = "(f32, f32)", value = "size" },
]

